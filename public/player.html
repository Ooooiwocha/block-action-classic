<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Block Action</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#646464}ruffle-player{width:100%;height:100%;display:block}#error{font:16px system-ui;color:white;padding:0}</style>
<div id="error"></div><script src="/mobile-fonts.js?v=1"></script><script src="/ruffle/ruffle.js?v=nightly-2026-10-05"></script><script src="/touch-input.js?v=2"></script><script src="/text-input.js?v=3"></script><script>
const originalFetch=window.fetch.bind(window);
window.fetch=async(...args)=>{const result=await originalFetch(...args);const url=String(args[0] instanceof Request?args[0].url:args[0]);if(url.includes('.php')){result.clone().text().then(text=>{const p=new URLSearchParams(text);if(p.get('pickup')==='true')parent.postMessage({type:'pickup-changed',id:Number(p.get('action_id')),enabled:p.get('pickup_enabled')==='true'},location.origin);else if(p.get('error')==='true')parent.postMessage({type:'game-error'},location.origin);else if(url.includes('saveMapData.php'))parent.postMessage({type:'stage-saved',id:Number(p.get('action_id'))},location.origin);}).catch(()=>{});}return result;};
window.addEventListener('DOMContentLoaded',async()=>{const id=Number(new URLSearchParams(location.search).get('stage'))||0;const p=RufflePlayer.newest().createPlayer();document.body.appendChild(p);window.addEventListener('ba-controller',e=>{const {code,down}=e.detail||{};if(![9,17,32,37,38,39,40].includes(code))return;if(down){p.focus({preventScroll:true});p.shadowRoot?.querySelector('canvas')?.focus({preventScroll:true});}p.dispatchEvent(new KeyboardEvent(down?'keydown':'keyup',{key:({9:'Tab',17:'Control',32:' ',37:'ArrowLeft',38:'ArrowUp',39:'ArrowRight',40:'ArrowDown'})[code],code:({9:'Tab',17:'ControlLeft',32:'Space',37:'ArrowLeft',38:'ArrowUp',39:'ArrowRight',40:'ArrowDown'})[code],keyCode:code,which:code,bubbles:true,composed:true,cancelable:true}));});installGameTouchInput(p);installGameTextInput(p);let lastTimer='';p.ruffle().addFSCommandHandler((command,args)=>{if(command!=='ba-timer')return;const match=/^(true|false)\|([0-9]+)$/.exec(args);const state=match&&match[1]==='true'?Number(match[2]):null;if(state!==null&&!Number.isSafeInteger(state))return;const signature=String(state);if(signature===lastTimer)return;lastTimer=signature;parent.postMessage({type:'game-timer',loops:state},location.origin);});try{await p.ruffle().load({url:'/Action-aligned.swf?v=16',deviceFontRenderer:'canvas',parameters:{start_id:String(id),edit:'0'},autoplay:'on',unmuteOverlay:'hidden',allowScriptAccess:true,openUrlMode:'deny',backgroundColor:'#646464'});}catch(e){document.getElementById('error').textContent='ゲームを読み込めませんでした。ページを再読み込みしてください。';}});
</script></html>
